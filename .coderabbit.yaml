# CodeRabbit config — lightweight, archive-appropriate.
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  path_filters:
    - "!solutions/**"  # don't nitpick historical submission snippets
    - "scripts/**"
    - ".github/**"
    - "*.md"
chat:
  auto_reply: true
